<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CISA Terminator – Domain Mode</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f4f6f9;
}
header{
    background:#1e293b;
    color:white;
    padding:16px;
}
.container{
    display:flex;
    height:calc(100vh - 64px);
}
.sidebar{
    width:350px;
    background:white;
    border-right:1px solid #ddd;
    overflow:auto;
    padding:15px;
}
.content{
    flex:1;
    background:white;
    overflow:auto;
    padding:20px;
}
.card{
    border:1px solid #ddd;
    border-radius:8px;
    padding:12px;
    margin-bottom:15px;
}
button{
    padding:10px 16px;
    cursor:pointer;
}
.domain{
    margin-top:12px;
    font-weight:bold;
    cursor:pointer;
}
.domain:hover{
    background:#eef;
}
.topic{
    margin-left:20px;
    cursor:pointer;
    padding:4px;
}
.topic:hover{
    background:#eef;
}
</style>
</head>

<body>

<header>
<h1>CISA Terminator – Domain Mode</h1>
</header>

<div class="container">

<div class="sidebar">

<div class="card">
<h3>Domain Import</h3>

<label>Domain 1:</label><br>
<input type="file" id="dom1" accept=".txt"><br><br>

<label>Domain 2:</label><br>
<input type="file" id="dom2" accept=".txt"><br><br>

<label>Domain 3:</label><br>
<input type="file" id="dom3" accept=".txt"><br><br>

<label>Domain 4:</label><br>
<input type="file" id="dom4" accept=".txt"><br><br>

<label>Domain 5:</label><br>
<input type="file" id="dom5" accept=".txt"><br><br>

<button id="importBtn">Import Domains</button><br><br>

<button id="clearBtn" style="background:#c62828;color:white;">Clear</button>
</div>

<div class="card">
<h3>Domains</h3>
<div id="tree"></div>
</div>

<div class="card">
<h3>Study Tools</h3>
<button onclick="showSummary()">Summary</button>
<button onclick="showFlashcards()">Flashcards</button>
<button onclick="showKeyTerms()">Key Terms</button>
<button onclick="showCheatSheet()">Cheat Sheet</button>
<button onclick="showLogicalMap()">Logical Map</button>
</div>

</div>

<div class="content">
<h2 id="contentTitle">Welcome</h2>
<div id="contentArea">Importáld az 5 domain TXT-t.</div>
</div>

</div>

<script src="app.js"></script>

</body>
</html>
