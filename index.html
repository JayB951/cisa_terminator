<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>CISA Terminator</title>

<link rel="stylesheet" href="styles.css">

</head>
<body>

<header>
    <h1>CISA Terminator</h1>
</header>

<div class="container">

    <!-- NAVIGATION -->

    <aside class="sidebar">

        <div class="card">

            <h3>Review PDF</h3>

            <input
                type="file"
                id="pdfFile"
                accept=".pdf">

            <button id="loadPdfBtn">
                Open PDF
            </button>

        </div>

        <div class="card">

            <h3>Navigation</h3>

            <div id="navigation"></div>

        </div>

    </aside>

    <!-- PDF -->

    <main class="viewer">

        <div class="viewer-toolbar">

            <button id="prevPageBtn">
                ◀
            </button>

            <span id="pageInfo">
                Page 0 / 0
            </span>

            <button id="nextPageBtn">
                ▶
            </button>

            <input
                type="number"
                id="gotoPageInput"
                placeholder="Page">

            <button id="gotoPageBtn">
                Go
            </button>

        </div>

        <div id="pdfCanvasContainer">

            <canvas id="pdfCanvas"></canvas>

        </div>

    </main>

    <!-- WORKSPACE -->

    <aside class="workspace">

        <div class="tabs">

            <button class="tab-btn active"
                    data-tab="notesTab">
                Notes
            </button>

            <button class="tab-btn"
                    data-tab="flashcardsTab">
                Flashcards
            </button>

            <button class="tab-btn"
                    data-tab="statsTab">
                Stats
            </button>

        </div>

        <div id="notesTab"
             class="tab-content active">

            <textarea
                id="notes"
                placeholder="Jegyzetek...">
            </textarea>

        </div>

        <div id="flashcardsTab"
             class="tab-content">

            Flashcards coming soon.

        </div>

        <div id="statsTab"
             class="tab-content">

            <p>
                Study Time:
                <span id="studyTime">
                    0 min
                </span>
            </p>

            <p>
                Notes Length:
                <span id="notesCount">
                    0
                </span>
            </p>

        </div>

    </aside>

</div>

<script src="navigation.js"></script>
<script src="pdf-viewer.js"></script>
<script src="app.js"></script>

</body>
</html>
