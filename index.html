<!DOCTYPE html>
<html lang="hu">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>CISA Terminator</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f4f6f9;
}

header{
    background:#1e293b;
    color:white;
    padding:15px 20px;
}

.container{
    display:flex;
    height:calc(100vh - 70px);
}

.sidebar{
    width:320px;
    background:white;
    border-right:1px solid #ddd;
    overflow:auto;
    padding:15px;
}

.viewer{
    flex:1;
    background:#f8f9fa;
}

.tools{
    width:320px;
    background:white;
    border-left:1px solid #ddd;
    overflow:auto;
    padding:15px;
}

.card{
    border:1px solid #ddd;
    border-radius:8px;
    padding:12px;
    margin-bottom:15px;
}

input{
    width:100%;
    padding:8px;
}

button{
    padding:10px 15px;
    cursor:pointer;
}

.domain{
    font-weight:bold;
    margin-top:12px;
    cursor:pointer;
    padding:6px;
}

.domain:hover{
    background:#eef;
}

.topic{
    padding:4px;
    margin-left:18px;
    cursor:pointer;
}

.topic:hover{
    background:#eef;
}

#pdfViewer{
    width:100%;
    height:100%;
    border:none;
}

textarea{
    width:100%;
    height:200px;
}

</style>
</head>

<body>

<header>
<h1>CISA Terminator</h1>
</header>

<div class="container">

    <!-- BAL OLDAL -->

    <div class="sidebar">

        <div class="card">

            <h3>Review Source</h3>

            <input
                type="text"
                id="driveLink"
                placeholder="Google Drive share link">

            <br><br>

            <button onclick="loadPdf()">
                Load Review
            </button>

        </div>

        <div class="card">

            <h3>CISA Navigation</h3>

            <div id="navigation"></div>

        </div>

    </div>

    <!-- KÖZÉP -->

    <div class="viewer">

        <iframe
            id="pdfViewer">
        </iframe>

    </div>

    <!-- JOBB OLDAL -->

    <div class="tools">

        <div class="card">

            <h3>Notes</h3>

            <textarea
                placeholder="Jegyzetek..."></textarea>

        </div>

        <div class="card">

            <h3>Study Tools</h3>

            <button>Summary</button><br><br>
            <button>Cheat Sheet</button><br><br>
            <button>Flashcards</button><br><br>
            <button>Logical Map</button>

        </div>

    </div>

</div>

<script>

let pdfBaseUrl = "";

const navigation = {

    "Domain 1":[
        { title:"1.1 IS Audit Standards", page:31 },
        { title:"1.2 Types of Audits", page:34 },
        { title:"1.3 Risk-Based Audit Planning", page:38 },
        { title:"1.4 Types of Controls", page:43 },
        { title:"1.5 Audit Project Management", page:53 },
        { title:"1.6 Audit Testing", page:60 },
        { title:"1.7 Audit Evidence Collection", page:63 },
        { title:"1.8 Audit Data Analytics", page:66 },
        { title:"1.9 Reporting and Communication", page:73 }
    ],

    "Domain 2":[],
    "Domain 3":[],
    "Domain 4":[],
    "Domain 5":[]
};

function renderNavigation(){

    const nav =
        document.getElementById(
            "navigation"
        );

    nav.innerHTML = "";

    Object.keys(navigation)
        .forEach(domain => {

        const d =
            document.createElement("div");

        d.className =
            "domain";

        d.textContent =
            domain;

        nav.appendChild(d);

        navigation[domain]
            .forEach(item => {

            const t =
                document.createElement(
                    "div"
                );

            t.className =
                "topic";

            t.textContent =
                item.title;

            t.onclick =
                () => goToPage(
                    item.page
                );

            nav.appendChild(t);

        });

    });

}

function loadPdf(){

    const url =
        document
        .getElementById(
            "driveLink"
        )
        .value
        .trim();

    if(!url){

        alert(
            "Adj meg egy Google Drive linket."
        );

        return;
    }

    const match =
        url.match(
            /\/d\/([^\/]+)/
        );

    if(!match){

        alert(
            "Nem sikerült kinyerni a file ID-t."
        );

        return;
    }

    const fileId =
        match[1];

    pdfBaseUrl =
        `https://drive.google.com/file/d/${fileId}/preview`;

    document
        .getElementById(
            "pdfViewer"
        )
        .src =
        pdfBaseUrl;

}

function goToPage(page){

    if(!pdfBaseUrl){

        alert(
            "Előbb töltsd be a Review PDF-et."
        );

        return;
    }

    document
        .getElementById(
            "pdfViewer"
        )
        .src =
        `${pdfBaseUrl}#page=${page}`;

}

renderNavigation();

</script>

</body>
</html>
