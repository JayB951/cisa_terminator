<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>CISA Terminator</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f6f9;
}

header{
    background:#1e293b;
    color:white;
    padding:16px;
}

.container{
    display:flex;
    height:calc(100vh - 64px);
}

.sidebar{
    width:350px;
    background:white;
    border-right:1px solid #ddd;
    overflow:auto;
    padding:15px;
}

.content{
    flex:1;
    background:white;
    overflow:auto;
    padding:20px;
}

.card{
    border:1px solid #ddd;
    border-radius:8px;
    padding:12px;
    margin-bottom:15px;
}

button{
    padding:10px 16px;
    cursor:pointer;
}

.chapter{
    margin-top:12px;
    font-weight:bold;
}

.section{
    margin-left:20px;
    cursor:pointer;
    padding:4px;
}

.section:hover{
    background:#eef;
}

textarea{
    width:100%;
    height:200px;
}

</style>
</head>

<body>

<header>
<h1>CISA Terminator</h1>
</header>

<div class="container">

<div class="sidebar">

<div class="card">

<h3>Review Import</h3>

<input
type="file"
id="txtFile"
accept=".txt">

<br><br>

<button id="importBtn">
Import TXT
</button>

</div>

<div class="card">

<h3>Knowledge Tree</h3>

<div id="tree"></div>

</div>

</div>

<div class="content">

<h2 id="contentTitle">
Welcome
</h2>

<div id="contentArea">

Importáld a Review TXT fájlt.

</div>

</div>

</div>
<script>
window.addEventListener("load", () => {
    initDB();
});
</script>
<script src="app.js"></script>

</body>
</html>
